[project]
name = "ytmp-ytm"
version = "0.1.0"
description = "YTMP source module for YouTube Music and YouTube (ytmusicapi + yt-dlp)"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "ytmusicapi>=1.12",
    "yt-dlp[default]>=2026.8.19",
    "fastapi>=0.142",
    "uvicorn>=0.54",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ytmp-ytm = "ytmp_ytm.http:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ytmp_ytm"]
