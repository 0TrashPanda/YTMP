[package]
name = "ytmp-desktop"
version = "0.1.0"
description = "YTMP for Windows and Linux: the web app in a window, YouTube Music on this computer"
license = "AGPL-3.0-only"
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-updater = "=2.14.0"
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-single-instance = "=2.5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
getrandom = "0.3"
url = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
