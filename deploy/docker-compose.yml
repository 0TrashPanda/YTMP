# Run YTMP on a server:
#   cp ytmp.example.toml ytmp.toml   (optional, every setting has a default)
#   echo "YTMP_MODULE_KEY=$(openssl rand -hex 32)" > .env
#   docker compose up -d --build
# Then open http://<server>:8080. Put a reverse proxy (e.g. Caddy) in front for HTTPS.

# Docker keeps console output forever by default: at most 3 × 10 MB per container here.
# The server also keeps its own log files in the ytmp-data volume (logs/, see [logs] in ytmp.toml).
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  ytmp:
    build:
      context: ..
      dockerfile: server/Dockerfile
    ports:
      - "8080:8080"
    environment:
      YTMP_YTM_URL: http://ytm:8401
      # Your server's public address, needed for logins, e.g. https://ytmp.example.com
      YTMP_URL: ${YTMP_URL:-}
      YTMP_MODULE_KEY: ${YTMP_MODULE_KEY:?set YTMP_MODULE_KEY in .env}
    volumes:
      - ./ytmp.toml:/config/ytmp.toml:ro
      - ytmp-data:/var/lib/ytmp
    depends_on:
      - ytm
    restart: unless-stopped
    logging: *logging

  ytm:
    build: ../ytm-module
    environment:
      YTMP_MODULE_KEY: ${YTMP_MODULE_KEY:?set YTMP_MODULE_KEY in .env}
      YTMP_YTM_LANGUAGE: en
      YTMP_YTM_LOCATION: BE
      # debug: also yt-dlp's steps for every song, not only for failed or slow ones.
      YTMP_YTM_LOG_LEVEL: info
    restart: unless-stopped
    logging: *logging

volumes:
  ytmp-data:
