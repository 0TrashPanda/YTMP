# Run YTMP on a server:
#   cp ytmp.example.toml ytmp.toml   (optional, every setting has a default)
#   echo "YTMP_MODULE_KEY=$(openssl rand -hex 32)" > .env
#   docker compose up -d
# Then open http://<server>:8080. Put a reverse proxy (e.g. Caddy) in front for HTTPS.
#
# Updates: the images come from GitHub (built for every release; the YouTube Music module
# also whenever a new yt-dlp is out). Watchtower checks every night at 4:00 and restarts
# with newer ones. To update right away: docker compose pull && docker compose up -d
# To stay on a version: YTMP_VERSION=0.7.0 in .env. To build from this checkout instead,
# add -f docker-compose.build.yml (see there).

# Docker keeps console output forever by default: at most 3 × 10 MB per container here.
# The server also keeps its own log files in the ytmp-data volume (logs/, see [logs] in ytmp.toml).
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  ytmp:
    image: ghcr.io/0trashpanda/ytmp-server:${YTMP_VERSION:-latest}
    ports:
      - "8080:8080"
    environment:
      YTMP_YTM_URL: http://ytm:8401
      # Your server's public address, needed for logins, e.g. https://ytmp.example.com
      YTMP_URL: ${YTMP_URL:-}
      YTMP_MODULE_KEY: ${YTMP_MODULE_KEY:?set YTMP_MODULE_KEY in .env}
    volumes:
      - ./ytmp.toml:/config/ytmp.toml:ro
      - ytmp-data:/var/lib/ytmp
    depends_on:
      - ytm
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    restart: unless-stopped
    logging: *logging

  ytm:
    image: ghcr.io/0trashpanda/ytmp-ytm:${YTMP_VERSION:-latest}
    environment:
      YTMP_MODULE_KEY: ${YTMP_MODULE_KEY:?set YTMP_MODULE_KEY in .env}
      YTMP_YTM_LANGUAGE: en
      YTMP_YTM_LOCATION: BE
      # debug: also yt-dlp's steps for every song, not only for failed or slow ones.
      YTMP_YTM_LOG_LEVEL: info
      # PO tokens make song lookups look like YouTube's own player, so its bot check comes later.
      YTMP_YTM_POT_URL: http://pot:4416
    # Song lookups start Deno (~250 MB each, at most 2 at once). If that still runs away, only
    # this service hits the limit, not the server next to it (memswap = mem: no swapping).
    mem_limit: 1536m
    memswap_limit: 1536m
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    restart: unless-stopped
    logging: *logging

  # Makes the PO tokens (bgutil, ~180 MB of memory). Only the module reaches it.
  pot:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    restart: unless-stopped
    logging: *logging

  # Updates the services above (only those) every night, and removes the old images.
  watchtower:
    image: nickfedor/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_SCHEDULE: "0 0 4 * * *"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      TZ: ${TZ:-Europe/Brussels}
    restart: unless-stopped
    logging: *logging

volumes:
  ytmp-data:
