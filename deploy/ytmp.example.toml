# YTMP server settings. Every value is optional; these are the defaults.
# YTMP_PORT, YTMP_YTM_URL, YTMP_MODULE_KEY and YTMP_DB_* environment variables override this file.
# Sign-up, guests, tracking default, trusted servers, room codes, audio proxy, cache size and
# log level can also be changed on the admin page (Settings → Server admin); that wins over this file.

[server]
host = "0.0.0.0"
port = 8080

[ytm]
# Where the YouTube Music module runs, and the key shared with it.
url = "http://127.0.0.1:8401"
key = ""

[database]
# Rooms (and later accounts, history, …) are kept here. sqlite | postgres
type = "sqlite"
# SQLite file. The Docker image uses /var/lib/ytmp/ytmp.db.
path = "ytmp.db"
# PostgreSQL, e.g. "postgresql://ytmp:secret@localhost/ytmp"
url = ""

[audio]
# Clients play YouTube's own stream links. Those only work on the server's internet connection
# (they're tied to its IP address); elsewhere a client falls back to streaming through the
# server, which uses its bandwidth. Who may do that:
#   always | lan (only devices on the server's local network, e.g. speakers) | never
# YTMP_AUDIO_PROXY overrides it.
proxy = "always"

[cache]
# Songs played here are kept, so they start at once and need no YouTube lookup (podcast
# episodes aren't). Empty dir: a "cache" folder next to the database (in Docker the data
# volume). YTMP_CACHE_DIR and YTMP_CACHE_SIZE override these.
dir = ""
# At most this much, e.g. "5GB" or "500MB"; "0" turns it off.
size = "5GB"

[sonos]
# Find Sonos speakers (SSDP). Needs UDP multicast replies to reach the server.
discovery = true
# Sonos speakers to always offer, by IP address. They're named after their Sonos room.
devices = []

[mpd]
# Find MPD players (e.g. a Raspberry Pi on a speaker) with mDNS. Inside Docker this needs
# network_mode: host.
discovery = true
# MPD players to always offer, as "host", "host:port" or "Name=host[:port]",
# e.g. ["Woonkamer=192.168.0.50"].
devices = []

[zones]
# The rooms of a multi-room amplifier, from a zones file on the network (docs/implementation/zones.md).
# Find zones files with mDNS. Inside Docker this needs network_mode: host.
discovery = true
# Zones files to always follow, e.g. ["http://192.168.0.50:8766/ytmp-zones.json"].
files = []

[accounts]
# This server's public address. Logins on pages served from there work; without it only
# this machine's own IP addresses do. YTMP_URL overrides it.
url = ""
# The name in account IDs (user@name). Default: the host name of url, or of this machine.
# It is remembered on first start; changing it later changes everyone's account ID.
name = ""
# Who may create accounts: open | invite | admin. The first account becomes the server admin.
signup = "invite"
# Other YTMP servers whose accounts may join rooms here.
trusted = []
# Whether new accounts keep a listening history until they turn it off.
tracking_default = false
# Whether people without an account can use this server (join rooms, search, …). false: only
# the login page works for them. YTMP_GUESTS overrides it.
guests = true

[logs]
# Log files, besides the console. They're cleaned up by themselves: a file per day, deleted
# after keep_days, and all together never more than max_mb (the oldest go first).
# Empty dir = console only. The Docker image uses /var/lib/ytmp/logs. YTMP_LOG_DIR overrides it.
dir = "logs"
# info | debug. YTMP_LOG_LEVEL overrides it.
level = "info"
keep_days = 14
max_mb = 100

[rooms]
# letters | digits | alnum
code_style = "letters"
code_length = 4
# Who may create rooms: "everyone", "accounts" or "admins" (joining is never limited).
create = "everyone"

[cast]
# Find Chromecasts on the network (mDNS). In Docker this needs network_mode: host.
discovery = true
# Cast devices to always offer, as "host" or "Name=host".
devices = []
# Where Cast devices fetch the audio. Empty = this server's address + port.
audio_base_url = ""

