# YTMP server settings. Every value is optional; these are the defaults.
# YTMP_PORT, YTMP_YTM_URL, YTMP_MODULE_KEY and YTMP_DB_* environment variables override this file.

[server]
host = "0.0.0.0"
port = 8080

[ytm]
# Where the YouTube Music module runs, and the key shared with it.
url = "http://127.0.0.1:8401"
key = ""

[database]
# Rooms (and later accounts, history, …) are kept here. sqlite | postgres
type = "sqlite"
# SQLite file. The Docker image uses /var/lib/ytmp/ytmp.db.
path = "ytmp.db"
# PostgreSQL, e.g. "postgresql://ytmp:secret@localhost/ytmp"
url = ""

[accounts]
# This server's public address. Logins on pages served from there work; without it only
# this machine's own IP addresses do. YTMP_URL overrides it.
url = ""
# The name in account IDs (user@name). Default: the host name of url, or of this machine.
# It is remembered on first start; changing it later changes everyone's account ID.
name = ""
# Who may create accounts: open | invite | admin. The first account becomes the server admin.
signup = "invite"
# Other YTMP servers whose accounts may join rooms here.
trusted = []

[rooms]
# letters | digits | alnum
code_style = "letters"
code_length = 4

[cast]
# Find Chromecasts on the network (mDNS). In Docker this needs network_mode: host.
discovery = true
# Cast devices to always offer, as "host" or "Name=host".
devices = []
# Where Cast devices fetch the audio. Empty = this server's address + port.
audio_base_url = ""

